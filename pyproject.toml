[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bounty-radar"
version = "0.1.0"
description = "Find open-source GitHub bounties that nobody is working on yet"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"

[project.scripts]
bounty-radar = "bounty_radar:main"

[tool.setuptools]
py-modules = ["bounty_radar"]
